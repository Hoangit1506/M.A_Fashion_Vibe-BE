# App specific config (JWT, Cloudinary, VNPAY)
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-exp-minutes: ${JWT_ACCESS_MINUTES}
    refresh-token-exp-days: ${JWT_REFRESH_DAYS}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  vnpay:
    tmnCode: ${VNPAY_TMN_CODE}
    hashSecret: ${VNPAY_HASH_SECRET}
    url: ${VNPAY_URL}
    returnUrl: ${VNPAY_RETURN_URL}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  name: ${ADMIN_NAME}


