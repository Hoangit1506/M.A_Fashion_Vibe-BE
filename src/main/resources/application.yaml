server:
  port: ${PORT}
  servlet:
    context-path: /ma-fashion-vibe

spring:
  application:
    name: ma_fashion_vibe-be
  servlet:
    multipart:
      max-file-size: 100MB       # Giới hạn dung lượng mỗi file ảnh,video
      max-request-size: 100MB    # Giới hạn tổng dung lượng nếu up nhiều ảnh,video cùng lúc


  datasource:
#   ?useSSL=false&serverTimezone=UTC   ?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update     # DEV: update; PRODUCTION: validate (dùng flyway)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


